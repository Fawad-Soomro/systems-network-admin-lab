name: SNA Lab 07 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format & Validate
        working-directory: terraform
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate

      - name: Build Docker Image
        run: docker build -f docker/Dockerfile -t sna-lab07-app:${{ github.sha }} .

      - name: Run Container & Smoke Test HTTP Endpoint
        run: |
          docker run -d --name ci-test-web -p 8088:80 sna-lab07-app:${{ github.sha }}
          sleep 3
          curl -f http://127.0.0.1:8088 | grep "INFT-620 Lab 07"
          docker rm -f ci-test-web
